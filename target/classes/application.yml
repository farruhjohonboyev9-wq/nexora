server:
  port: 5020
  shutdown: graceful

spring:
  application:
    name: nexora-search-service

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 100ms

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/nexora_auth_dev}
    username: ${POSTGRES_USER:nexora}
    password: ${POSTGRES_PASSWORD:nexora_pass}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC

search:
  index:
    users: users_search
    posts: posts_search
    hashtags: hashtags_search

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
